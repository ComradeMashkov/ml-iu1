[project]
name = "ml-iu1-course"
version = "0.1.0"
description = "Quarto site and executable lecture figures for the IU-1 machine-learning course"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ipykernel>=6.29,<7",
  "jupyter>=1.1,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
]

[dependency-groups]
dev = [
  "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
