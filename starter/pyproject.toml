[project]
name = "ml-sau-starter"
version = "0.1.0"
description = "Starter project for IU-1 machine-learning seminars S1-S3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
]

[dependency-groups]
dev = [
  "jupyter>=1.1,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_sau"]

[tool.uv]
required-version = "==0.11.32"

[tool.ruff]
target-version = "py312"
line-length = 100
