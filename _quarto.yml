project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "syllabus.qmd"
    - "course-map.qmd"
    - "resources.qmd"
    - "lectures/index.qmd"
    - "lectures/L00-engineering-ml.qmd"
    - "lectures/L01-how-models-learn.qmd"
    - "seminars/index.qmd"
    - "seminars/S01-first-classifier.qmd"
    - "seminars/S02-sensor-data-pipeline.qmd"
    - "seminars/S03-gradient-descent.qmd"
    - "seminars/S04-model-evaluation.qmd"
    - "!lectures/L00-speaker-script.md"
    - "!lectures/L01-speaker-script.md"
    - "!seminars/S01-speaker-script.md"
    - "!seminars/S02-speaker-script.md"
    - "!seminars/S03-speaker-script.md"
    - "!seminars/S04-speaker-script.md"
  resources:
    - starter/.gitignore
    - starter/.github/workflows/check.yml
    - starter/Makefile
    - starter/README.md
    - starter/notebooks/S01-live-coding.ipynb
    - starter/notebooks/S02-live-coding.ipynb
    - starter/notebooks/S03-live-coding.ipynb
    - starter/notebooks/S04-live-coding.ipynb
    - starter/notebooks/solutions/S01-complete.ipynb
    - starter/notebooks/solutions/S02-complete.ipynb
    - starter/notebooks/solutions/S03-complete.ipynb
    - starter/notebooks/solutions/S04-complete.ipynb
    - starter/lessons/s03.py
    - starter/lessons/s04.py
    - starter/lessons/s01.py
    - starter/lessons/s02.py
    - starter/data/**
    - assets/next-class.js
    - assets/slides-layout.js
    - assets/vendor/katex/**
    - starter/configs/first-model.json
    - starter/pyproject.toml
    - starter/src/ml_sau/__init__.py
    - starter/src/ml_sau/course_case.py
    - starter/src/ml_sau/first_model.py
    - starter/src/ml_sau/sensor.py
    - starter/src/ml_sau/sensor_source.py
    - starter/tests/test_sources.py
    - starter/tests/test_first_model.py
    - starter/tests/test_sensor.py
    - starter/tests/test_reset_notebooks.py
    - starter/tools/reset_notebooks.py
    - starter/uv.lock
  preview:
    port: 4242
    browser: true

website:
  title: "Машинное обучение · ИУ-1"
  description: "Инженерный курс ML для систем управления ЛА: сенсорика, честная валидация, Edge AI и MLOps."
  site-url: "https://comrademashkov.github.io/ml-iu1/"
  repo-url: "https://github.com/ComradeMashkov/ml-iu1"
  repo-actions: [source, issue]
  page-navigation: true
  reader-mode: true
  navbar:
    background: light
    foreground: dark
    title: "ML · ИУ-1"
    left:
      - text: "Главная"
        href: index.qmd
      - text: "Программа"
        href: syllabus.qmd
      - text: "Карта курса"
        href: course-map.qmd
      - text: "Лекции"
        href: lectures/index.qmd
      - text: "Семинары"
        href: seminars/index.qmd
      - text: "Инструменты"
        href: resources.qmd
    right:
      - icon: github
        href: "https://github.com/ComradeMashkov/ml-iu1"
        aria-label: "Исходники курса на GitHub"
  page-footer:
    border: true
    left: "© 2026 · Машков И.И. · кафедра ИУ-1"
    center: "Машинное обучение · ИУ-1"
    right: "Собрано с [Quarto](https://quarto.org)"

format:
  html:
    theme:
      - cosmo
      - assets/theme/custom.scss
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
    toc: true
    toc-title: "На странице"
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    fig-cap-location: bottom
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: true

bibliography: assets/references.bib
lang: ru
