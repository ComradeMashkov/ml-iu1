project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "!lectures/L00-speaker-script.md"
    - "!seminars/S01-speaker-script.md"
    - "!seminars/S02-speaker-script.md"
    - "!seminars/S03-speaker-script.md"
  resources:
    - starter/.gitignore
    - starter/.github/workflows/check.yml
    - starter/Makefile
    - starter/README.md
    - starter/notebooks/S01-live-coding.ipynb
    - starter/notebooks/S02-live-coding.ipynb
    - starter/notebooks/S03-live-coding.ipynb
    - starter/configs/first-model.json
    - starter/configs/baseline.json
    - starter/pyproject.toml
    - starter/src/ml_sau/__init__.py
    - starter/src/ml_sau/baseline.py
    - starter/src/ml_sau/course_case.py
    - starter/src/ml_sau/first_model.py
    - starter/src/ml_sau/sensor.py
    - starter/src/ml_sau/sensor_source.py
    - starter/tests/test_sources.py
    - starter/uv.lock
  preview:
    port: 4242
    browser: true

website:
  title: "Машинное обучение · ИУ-1"
  description: "Инженерный курс ML для систем управления ЛА: сенсорика, честная валидация, Edge AI и MLOps."
  site-url: "https://comrademashkov.github.io/ml-iu1/"
  repo-url: "https://github.com/ComradeMashkov/ml-iu1"
  repo-actions: [source, issue]
  page-navigation: true
  reader-mode: true
  navbar:
    background: light
    foreground: dark
    title: "ML · ИУ-1"
    left:
      - text: "Главная"
        href: index.qmd
      - text: "Программа"
        href: syllabus.qmd
      - text: "Вход"
        href: prerequisites.qmd
      - text: "Карта курса"
        href: course-map.qmd
      - text: "Лекции"
        href: lectures/index.qmd
      - text: "Семинары"
        href: seminars/index.qmd
      - text: "Проект"
        href: project/index.qmd
    right:
      - icon: github
        href: "https://github.com/ComradeMashkov/ml-iu1"
        aria-label: "Исходники курса на GitHub"
  page-footer:
    border: true
    left: "© 2026 · Машков И.И. · кафедра ИУ-1"
    center: "Машинное обучение для систем управления ЛА"
    right: "Собрано с [Quarto](https://quarto.org)"

format:
  html:
    theme:
      - cosmo
      - assets/theme/custom.scss
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
    toc: true
    toc-title: "На странице"
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    fig-cap-location: bottom
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: true

bibliography: assets/references.bib
lang: ru
